##############################################################################
# POLARIS WebGIS — Docker Compose Configuration
# Arsitektur 3-tier: PostGIS (DB) → Express (API) → React/Leaflet (Frontend)
# 
# MENGAPA docker-compose? 
# Mengisolasi setiap tier dalam container terpisah agar deployment konsisten 
# dan reproducible di berbagai environment (dev, staging, prod).
##############################################################################

services:
  ##########################################################################
  # SERVICE 1: PostGIS Database
  # Menggunakan image postgis/postgis:15-3.3 yang sudah include 
  # PostgreSQL 15 + PostGIS 3.3 extension untuk operasi geospasial.
  ##########################################################################
  postgis-db:
    image: postgis/postgis:15-3.3
    container_name: polaris-postgis
    restart: unless-stopped
    environment:
      # TODO(security): Untuk production, gunakan Docker secrets atau KMS 
      # untuk menyimpan password. Jangan gunakan plain-text env vars.
      POSTGRES_DB: polaris_db
      POSTGRES_USER: polaris_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-polaris_secure_2024}
    ports:
      - "5433:5432"
    volumes:
      # Mount init.sql ke entrypoint agar dieksekusi saat container pertama
      # kali dijalankan. PostgreSQL otomatis menjalankan .sql di folder ini.
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Health check memastikan PostgreSQL benar-benar siap menerima koneksi
      # sebelum backend mencoba terhubung.
      test: ["CMD-SHELL", "pg_isready -U polaris_user -d polaris_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - polaris-network

  ##########################################################################
  # SERVICE 2: Express.js Backend API
  # REST API server yang melakukan query ke PostGIS dan mengembalikan 
  # data GeoJSON ke frontend.
  ##########################################################################
  api-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: polaris-api
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DB_HOST: postgis-db
      DB_PORT: 5432
      DB_NAME: polaris_db
      DB_USER: polaris_user
      DB_PASSWORD: ${POSTGRES_PASSWORD:-polaris_secure_2024}
      # CORS origin — harus sesuai dengan URL frontend (allow multiple origins)
      CORS_ORIGIN: "http://localhost:3000,http://0.0.0.0:3000,http://127.0.0.1:3000,http://react-frontend:3000"
      API_PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      postgis-db:
        # Menggunakan condition: service_healthy agar backend HANYA start 
        # setelah PostGIS benar-benar siap (bukan hanya container up).
        condition: service_healthy
    networks:
      - polaris-network

  ##########################################################################
  # SERVICE 3: React Frontend (Multi-stage build → Nginx)
  # Build React app kemudian serve via Nginx untuk performa optimal.
  ##########################################################################
  react-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Inject API URL saat build untuk digunakan oleh React
        REACT_APP_API_URL: http://localhost:5000
    container_name: polaris-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api-backend
    networks:
      - polaris-network

##############################################################################
# VOLUMES: Persistent storage untuk data PostgreSQL
##############################################################################
volumes:
  pgdata:
    driver: local

##############################################################################
# NETWORKS: Internal bridge network untuk komunikasi antar-container
##############################################################################
networks:
  polaris-network:
    driver: bridge
