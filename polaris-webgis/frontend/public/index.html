<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO Meta Tags -->
    <title>POLARIS — Pemetaan Operasional Longsor &amp; Akses Rawan Isolasi Sumatera</title>
    <meta name="description" content="Dashboard WebGIS POLARIS untuk pemetaan dan simulasi operasional longsor serta identifikasi akses rawan isolasi di wilayah Sumatera. Visualisasi real-time zona bahaya, ruas jalan, dan fasilitas kesehatan." />
    <meta name="keywords" content="WebGIS, longsor, Sumatera, Lampung, pemetaan bencana, simulasi, POLARIS" />
    <meta name="author" content="POLARIS WebGIS Team" />
    
    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="POLARIS — Dashboard WebGIS Bencana Sumatera" />
    <meta property="og:description" content="Pemetaan Operasional Longsor dan Akses Rawan Isolasi Sumatera" />
    <meta property="og:type" content="website" />
    
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌍</text></svg>" />
    
    <!--
      Leaflet CSS — Library CSS untuk rendering peta interaktif.
      MENGAPA di sini (bukan di React)? Leaflet membutuhkan CSS global 
      yang harus dimuat SEBELUM komponen React dirender, untuk menghindari
      flash of unstyled content pada map container.
      
      TODO(security): Untuk production, tambahkan SRI hash pada CDN resources.
      Saat ini menggunakan CDN unpkg yang reliable tapi idealnya di-bundle.
    -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    
    <!--
      Google Fonts — Inter untuk body text, JetBrains Mono untuk data numerik.
      MENGAPA Inter? Font sans-serif modern yang dirancang khusus untuk 
      readability di layar komputer, populer di dashboard enterprise.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
</head>
<body class="dark">
    <noscript>
      Anda perlu mengaktifkan JavaScript untuk menjalankan dashboard POLARIS WebGIS.
    </noscript>
    <div id="root"></div>
</body>
</html>
